<body>
<main class="wrap">
<div class="lang-bar">
 <button class="lang-btn active" data-lang="ja" onclick="setLang('ja')">日本語</button>
 <button class="lang-btn" data-lang="en" onclick="setLang('en')">English</button>
 <button class="lang-btn" data-lang="zh" onclick="setLang('zh')">中文</button>
</div>
<section class="hero">
 <div class="badge" data-i18n="badge"></div>
 <h1 data-i18n-html="h1"></h1>
 <p class="lead" data-i18n-html="lead"></p>
 <div class="hero-note" data-i18n="heroNote"></div>
</section>

<section id="startCard" class="card start-card">

 <h2 data-i18n="startTitle"></h2>
 <p class="sub" data-i18n-html="startSub"></p>
 <div class="flow">
  <span class="flow-step" data-i18n="flow1"></span><span class="flow-arrow">→</span>
  <span class="flow-step" data-i18n="flow2"></span><span class="flow-arrow">→</span>
  <span class="flow-step" data-i18n="flow3"></span>
 </div>
 <div class="benefits">
  <div class="benefit"><b data-i18n="b1t"></b><span data-i18n="b1d"></span></div>
  <div class="benefit"><b data-i18n="b2t"></b><span data-i18n="b2d"></span></div>
  <div class="benefit"><b data-i18n="b3t"></b><span data-i18n="b3d"></span></div>
 </div>
 <button class="primary" onclick="startQuiz()" data-i18n="startBtn"></button>
</section>

<section id="quizCard" class="card hidden">
 <div class="progress-wrap"><div class="progress"><i id="bar"></i></div><div class="count" id="count"></div></div>
 <div class="eyebrow" data-i18n="quizEyebrow"></div>
 <h2 class="question" id="question"></h2>
 <div class="answers" id="answers"></div>
 <button class="quiz-back" id="backBtn" onclick="goBack()" data-i18n="backBtn"></button>
</section>

<section id="resultCard" class="card hidden">
 <div class="result-kicker" id="resultType"></div>
 <h2 class="result-title" id="resultTitle"></h2>
 <p class="result-lead" id="resultText"></p>
 <div class="tags" id="tags"></div>

 <div class="section">
  <h3 data-i18n="secHobbies"></h3>
  <p class="section-desc" data-i18n="secHobbiesDesc"></p>
  <div class="hobbies" id="hobbies"></div>
 </div>

 <div class="section">
  <h3 data-i18n="secNext"></h3>
  <div class="next" id="next"></div>
 </div>

 <div class="section">
  <h3 data-i18n="secDiscovery"></h3>
  <div class="discovery" id="discovery"></div>
 </div>

 <div class="section">
  <h3 data-i18n="secTip"></h3>
  <div class="tip" id="tip"></div>
 </div>

 <div class="actions">
  <button class="primary" onclick="shareResult()" data-i18n="shareBtn"></button>
  <button class="secondary" onclick="location.reload()" data-i18n="retryBtn"></button>
 </div>
 <p class="note" data-i18n-html="note"></p>
</section>
<footer data-i18n="footer"></footer>
</main>

const pairs={
 "読書":["美術館巡り","語学"],"写真散歩":["ハイキング","カフェ巡り"],"料理":["ガーデニング","DIY"],"ボードゲーム":["ゲーム","カフェ巡り"],"筋トレ":["ハイキング","楽器"],"ハイキング":["写真散歩","キャンプ"],"イラスト":["動画編集","美術館巡り"],"楽器":["歌・音楽鑑賞","ゲーム"],"語学":["旅行","読書"],"ガーデニング":["料理","写真散歩"],"動画編集":["写真散歩","イラスト"],"カフェ巡り":["写真散歩","読書"],"美術館巡り":["写真散歩","イラスト"],"キャンプ":["ハイキング","写真散歩"],"ゲーム":["ボードゲーム","動画編集"],"DIY":["料理","ガーデニング"]
};

let lang = localStorage.getItem("hobbyLang") || "ja";
let idx=0,score={A:0,B:0,C:0},trait={I:0,E:0,N:0,S:0,T:0,F:0},history=[],lastRanked=null,lastType=null;
const $=id=>document.getElementById(id);
const t=()=>I18N[lang];
const htxt=key=> (HOBBY_I18N[lang]&&HOBBY_I18N[lang][key]) || HOBBY_I18N.ja[key];

function applyStaticI18n(){
 const d=t();
 document.documentElement.lang=d.htmlLang;
 document.title=d.title;
 document.querySelector('meta[name="description"]').setAttribute("content",d.desc);
 document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=d[el.dataset.i18n]});
 document.querySelectorAll("[data-i18n-html]").forEach(el=>{el.innerHTML=d[el.dataset.i18nHtml]});
 document.querySelectorAll(".lang-btn").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
}

function setLang(next){
 lang=next;
 localStorage.setItem("hobbyLang",lang);
 applyStaticI18n();
 if(!$("quizCard").classList.contains("hidden")) showQuestion();
 if(!$("resultCard").classList.contains("hidden") && lastRanked) renderResultView();
}

function startQuiz(){
 $("startCard").classList.add("hidden");$("quizCard").classList.remove("hidden");
 idx=0;score={A:0,B:0,C:0};trait={I:0,E:0,N:0,S:0,T:0,F:0};history=[];lastRanked=null;
 showQuestion();window.scrollTo({top:0,behavior:"smooth"});
}
function showQuestion(){
 const x=t().questions[idx];
 $("count").textContent=`${idx+1} / ${t().questions.length}`;
 $("bar").style.width=(idx/t().questions.length*100)+"%";
 $("question").textContent=x.q;$("answers").innerHTML="";
 x.a.forEach((a,n)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<b>${a[0]}　${a[1]}</b><small>${a[2]}</small>`;b.onclick=()=>answer(a[0],n);$("answers").appendChild(b)});
}
function answer(letter,n){
 score[letter]++;
 if(n===0){trait.I++;trait.N++;trait.T++}
 if(n===1){trait.E++;trait.S++;trait.F++}
 if(n===2){trait.N++;trait.F++}
 history.push({letter,n});
 idx++;
 if(idx<t().questions.length)showQuestion();else showResult();
}
function goBack(){
 if(idx===0)return;
 idx--;
 const last=history.pop();
 if(!last)return;
 score[last.letter]--;
 if(last.n===0){trait.I--;trait.N--;trait.T--}
 if(last.n===1){trait.E--;trait.S--;trait.F--}
 if(last.n===2){trait.N--;trait.F--}
 showQuestion();
 window.scrollTo({top:0,behavior:"smooth"});
}
function showResult(){
 $("quizCard").classList.add("hidden");$("resultCard").classList.remove("hidden");
 const ie=trait.I>=trait.E?"I":"E",ns=trait.N>=trait.S?"N":"S",tf=trait.T>=trait.F?"T":"F",jp=score.A>=score.C?"J":"P";
 lastType=ie+ns+tf+jp;
 lastRanked=hobbies.map((h,i)=>{
  let s=50;
  if(h[2].includes(ie))s+=13;if(h[2].includes(ns))s+=13;if(h[2].includes(tf))s+=11;
  if(score.A>score.B&&h[1].includes("一人"))s+=7;
  if(score.B>score.A&&h[1].includes("交流"))s+=7;
  if(score.C>score.A&&h[1].includes("発見"))s+=7;
  return {key:h[0],tags:h[1],s,i};
 }).sort((a,b)=>b.s-a.s || Math.random()-.5).slice(0,5);
 renderResultView();
 window.scrollTo({top:0,behavior:"smooth"});
}
function renderResultView(){
 const d=t();
 const type=lastType;
 const ie=type[0],ns=type[1],tf=type[2],jp=type[3];
 $("resultType").textContent=`${d.typePrefix}${type}`;
 $("resultTitle").textContent=d.titles[type];
 $("resultText").textContent=d.resultLead(d.intro[ie],d.intro[ns],d.intro[tf]);
 $("tags").innerHTML=[d.tags[ie],d.tags[ns],d.tags[tf],d.tags[jp]].map(x=>`<span class="tag">${x}</span>`).join("");
 $("hobbies").innerHTML=lastRanked.map((r,i)=>{
  const hx=htxt(r.key);
  return `<article class="hobby"><div class="hobby-head"><div><span class="rank">#${i+1}</span> <span class="hobby-name">${hx[0]}</span></div><span class="match">${Math.min(99,r.s)}%</span></div><div class="hobby-meta">${hx[1].split(/[・·]/).map(x=>x.trim()&&`<span class="mini">${x.trim()}</span>`).join("")}</div><p>${hx[2]}</p></article>`;
 }).join("");
 const topKey=lastRanked[0].key;
 const top=htxt(topKey);
 $("next").innerHTML=`<strong>${top[0]}</strong><p>${top[3]}。${d.nextBody}</p>`;
 const pair=pairs[topKey]||["写真散歩","読書"];
 $("discovery").innerHTML=pair.map((x,i)=>{
  const name=htxt(x)[0];
  return `<div><b>${i===0?d.discNear:d.discFar} → ${name}</b><span>${i===0?d.discNearD:d.discFarD}</span></div>`;
 }).join("");
 $("tip").textContent=d.tips[(score.A*2+score.B*3+score.C)%d.tips.length];
}
async function shareResult(){
 const d=t();
 const names=[...document.querySelectorAll(".hobby-name")].slice(0,3).map(x=>x.textContent).join(lang==="en"? ", " : "、");
 const text=d.shareText($("resultType").textContent,$("resultTitle").textContent,names);
 if(navigator.share){try{await navigator.share({title:d.shareTitle,text,url:location.href})}catch(e){}}
 else if(navigator.clipboard){await navigator.clipboard.writeText(text+location.href);alert(d.copied)}
}
applyStaticI18n();
</script>
