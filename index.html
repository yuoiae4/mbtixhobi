let lang = "ja";
let idx=0,score={A:0,B:0,C:0},trait={I:0,E:0,N:0,S:0,T:0,F:0,J:0,P:0},history=[],lastRanked=null,lastAvoid=null,lastType=null;
const $=id=>document.getElementById(id);
const t=()=>I18N[lang]||I18N.ja;
const htxt=key=> (HOBBY_I18N[lang]&&HOBBY_I18N[lang][key]) || HOBBY_I18N.ja[key];

function applyStaticI18n(){
 const d=t();
 document.documentElement.lang=d.htmlLang;
 document.title=d.title;
 document.querySelector('meta[name="description"]').setAttribute("content",d.desc);
 document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=d[el.dataset.i18n]});
 document.querySelectorAll("[data-i18n-html]").forEach(el=>{el.innerHTML=d[el.dataset.i18nHtml]});
 document.querySelectorAll(".lang-btn").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
}

function setLang(next){
 lang=next;
 applyStaticI18n();
 if(!$("quizCard").classList.contains("hidden")) showQuestion();
 if(!$("resultCard").classList.contains("hidden") && lastRanked) renderResultView();
}

function goHome(){
 $("quizCard").classList.add("hidden");
 $("resultCard").classList.add("hidden");
 $("startCard").classList.remove("hidden");
 idx=0;score={A:0,B:0,C:0};trait={I:0,E:0,N:0,S:0,T:0,F:0,J:0,P:0};history=[];lastRanked=null;lastAvoid=null;lastType=null;
 window.scrollTo({top:0,behavior:"smooth"});
}
let qLen=8;
function startQuiz(mode){
 qLen=mode==="full"?16:8;
 $("startCard").classList.add("hidden");$("quizCard").classList.remove("hidden");
 idx=0;score={A:0,B:0,C:0};trait={I:0,E:0,N:0,S:0,T:0,F:0,J:0,P:0};history=[];lastRanked=null;lastAvoid=null;
 showQuestion();window.scrollTo({top:0,behavior:"smooth"});
}
const QTRAIT=[
 [{I:2},{E:2},{I:1,E:1}],
 [{I:2},{E:2},{P:1,N:1}],
 [{T:2},{F:2},{N:2}],
 [{F:1,S:1},{S:2,E:1},{N:2,T:1}],
 [{J:2},{J:1},{P:2}],
 [{S:1},{F:1},{S:2}],
 [{T:2},{E:2,F:1},{N:2}],
 [{S:1},{N:2},{N:1,P:1}],
 [{N:2,J:1},{S:2},{E:2,F:1}],
 [{J:2,T:1},{T:1,J:1},{P:2,F:1}],
 [{I:2},{I:1,E:1},{E:2,F:1}],
 [{T:2},{F:2},{N:1,P:2}],
 [{I:2},{E:2,S:1},{S:1,P:1}],
 [{T:1,J:1},{S:1,F:1},{E:2,F:1}],
 [{T:2,N:1},{F:2},{S:2,J:1}],
 [{J:2},{S:1,P:1},{E:2,J:1}]
];
function applyTraits(n,sign){
 const map=QTRAIT[idx][n];
 Object.keys(map).forEach(k=>{
  if(trait[k]==null)trait[k]=0;
  trait[k]+=sign*map[k];
 });
}
function showQuestion(){
 const x=t().questions[idx];
 $("count").textContent=`${idx+1} / ${qLen}`;
 $("bar").style.width=((idx)/qLen*100)+"%";
 $("question").textContent=x.q;$("answers").innerHTML="";
 $("backBtn").style.visibility=idx===0?"hidden":"visible";
 x.a.forEach((a,n)=>{const b=document.createElement("button");b.className="answer";b.innerHTML=`<b>${a[0]}　${a[1]}</b><small>${a[2]}</small>`;b.onclick=()=>answer(a[0],n);$("answers").appendChild(b)});
}
function answer(letter,n){
 score[letter]++;
 applyTraits(n,1);
 history.push({letter,n,q:idx});
 idx++;
 if(idx<qLen)showQuestion();else showResult();
}
function goBack(){
 if(idx===0)return;
 idx--;
 const last=history.pop();
 if(!last)return;
 score[last.letter]--;
 const saved=idx;
 idx=last.q;
 applyTraits(last.n,-1);
 idx=saved;
 showQuestion();
 window.scrollTo({top:0,behavior:"smooth"});
}
function showResult(){
 $("quizCard").classList.add("hidden");$("resultCard").classList.remove("hidden");
 $("bar").style.width="100%";
 const ie=trait.I>=trait.E?"I":"E",ns=trait.N>=trait.S?"N":"S",tf=trait.T>=trait.F?"T":"F",jp=(trait.J||0)>=(trait.P||0)?"J":"P";
 lastType=ie+ns+tf+jp;
 const scored=hobbies.map((h,i)=>{
  let s=48;
  if(h[2].includes(ie))s+=14;if(h[2].includes(ns))s+=14;if(h[2].includes(tf))s+=12;
  if(jp==="J"&&h[2].includes("J"))s+=6;
  if(jp==="P"&&(h[1].includes("発見")||h[1].includes("交流")))s+=4;
  if(score.A>score.B&&h[1].includes("一人"))s+=8;
  if(score.B>score.A&&(h[1].includes("交流")||h[1].includes("外出")))s+=8;
  if(score.C>=score.A&&h[1].includes("発見"))s+=7;
  if(score.A>=3&&(h[1].includes("上達")||h[1].includes("継続")))s+=5;
  return {key:h[0],tags:h[1],s,traits:h[2],i};
 }).sort((a,b)=>b.s-a.s || a.i-b.i);
 lastRanked=scored.slice(0,5);
 lastAvoid=scored.slice(-3).reverse();
 renderResultView();
 window.scrollTo({top:0,behavior:"smooth"});
}
function renderResultView(){
 const d=t();
 const type=lastType;
 const ie=type[0],ns=type[1],tf=type[2],jp=type[3];
 $("resultType").textContent=`${d.typePrefix}${type}`;
 const qTime=history[4]?history[4].n:0;
 const qBar=history[5]?history[5].n:0;
 const qNow=history[7]?history[7].n:0;
 $("resultTitle").textContent=d.titles[type];
 $("resultText").textContent=d.resultLead(d.tags[ie],d.tags[ns],d.tags[tf]);
 $("resultAttrs").textContent=`${d.attrPrefix}${[d.extraTime[qTime],d.extraBarrier[qBar],d.extraNow[qNow]].join(" / ")}`;
 $("tags").innerHTML=[d.tags[ie],d.tags[ns],d.tags[tf],d.tags[jp]].map(x=>`<span class="tag">${x}</span>`).join("");
 const dimPair=(a,b)=>{
  const va=trait[a]||0,vb=trait[b]||0,sum=Math.max(1,va+vb);
  return `<div class="dim"><span>${d.tags[a]}</span><div class="dim-bar"><i style="width:${Math.round(va/sum*100)}%"></i></div><span>${d.tags[b]}</span></div>`;
 };
 $("dims").innerHTML=dimPair("I","E")+dimPair("N","S")+dimPair("T","F")+dimPair("J","P");
 $("hobbies").innerHTML=lastRanked.map((r,i)=>{
  const hx=htxt(r.key);
  return `<article class="hobby"><div class="hobby-head"><div><span class="rank">#${i+1}</span> <span class="hobby-name">${hx[0]}</span></div><span class="match">${Math.min(99,r.s)}%</span></div><div class="hobby-meta">${hx[1].split(/[・·]/).map(x=>x.trim()&&`<span class="mini">${x.trim()}</span>`).join("")}</div><p>${hx[2]}</p></article>`;
 }).join("");
 const topKey=lastRanked[0].key;
 const top=htxt(topKey);
 $("next").innerHTML=`<strong>${top[0]}</strong><p>${top[3]} ${d.nextBody}</p>`;
 const pair=pairs[topKey]||["写真散歩","読書"];
 $("discovery").innerHTML=pair.map((x,i)=>{
  const name=htxt(x)[0];
  return `<div><b>${i===0?d.discNear:d.discFar} → ${name}</b><span>${i===0?d.discNearD:d.discFarD}</span></div>`;
 }).join("");
 $("tip").textContent=d.tips[(score.A*2+score.B*3+score.C)%d.tips.length];
 const planBits=lang==="en"
  ?["Block 30 minutes. Do only the smallest unit of the top option.","Use tools you already own. Do not buy first.","After one session, record only whether you would allocate time again."]
  :lang==="zh"
  ?["先空出 30 分钟，只做第 1 项里最小的一步。","只用现有工具，先不采购。","结束后只记录：是否愿意再投入同样的时间。"]
  :["30分の枠を先に確保する。1位候補の最小単位だけ実施する。","新規購入はしない。手元の道具で一回分を完了する。","終了後、「同等の時間を再配分するか」だけ記録する。"];
 $("plan").innerHTML=planBits.map(x=>`<li>${x}</li>`).join("");
 if(lastAvoid){
  $("avoid").innerHTML=lastAvoid.map(r=>{
   const hx=htxt(r.key);
   return `<div class="avoid-item"><b>${hx[0]}</b>${hx[2]}</div>`;
  }).join("");
 }
}
async function shareResult(){
 const d=t();
 const names=[...document.querySelectorAll(".hobby-name")].slice(0,3).map(x=>x.textContent).join(lang==="en"? ", " : "、");
 const text=d.shareText($("resultType").textContent,$("resultTitle").textContent,names);
 if(navigator.share){try{await navigator.share({title:d.shareTitle,text,url:location.href})}catch(e){}}
 else if(navigator.clipboard){await navigator.clipboard.writeText(text+location.href);alert(d.copied)}
}
applyStaticI18n();
</script>
